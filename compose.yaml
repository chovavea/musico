services:
  musico:
    build: .
    # 测试/开发专用镜像标签：正式镜像 musico:latest 由部署目录单独构建，
    # 两者互不覆盖，端口也用 8090 与正式栈的 8080 错开。
    image: music:evolve
    # Application settings live in .env only; compose keeps just the values that
    # describe the container itself (service DNS, in-container paths, timezone).
    # Anything added to .env is picked up here without touching this file.
    env_file:
      - path: .env
        required: false
    ports: ["8090:8080"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENABLE_MEDIA_RESOLVER: "false"
      LOG_LEVEL: INFO
      STALENESS_MULTIPLIER: "2"
      TZ: Asia/Shanghai
      API_TOKEN: ${API_TOKEN:-}
      BOARDS_YAML: /app/configs/boards.yaml
      MUSIC_LIBRARY_DIR: /app/data/music
      DOWNLOAD_SOURCE_CONFIG: /app/configs/download_sources.yaml
      DOWNLOAD_SOURCE_DIRS: /app/download_sources
    volumes:
      - ./configs:/app/configs:ro
      - ./data/music:/app/data/music
      - ./server/app/download_sources:/app/download_sources:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/platforms', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    ports:
      # 宿主访问测试库用 5433：5432 被正式栈的 musico-postgres 占用。
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # 测试库数据落在项目目录内（Bind Mount），与正式栈的具名卷
      # musico_postgres_data 彻底分离：不会误挂正式库，也不会被 down -v 删掉。
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
