# 总览页的两个卡片槽位：enabled 的榜单里必须恰好各有一个 overview_slot: left
# 和一个 right，否则启动时报
#   "enabled overview_slot must contain exactly left and right"
# 并直接退出（禁用掉带槽位的榜单也算缺失）。其余榜单不写 overview_slot，
# 只在榜单页展示。
boards:
  - id: qq_hot
    platform: qqmusic
    name: QQ音乐热歌榜
    type: hot
    enabled: true
    overview_slot: left
    interval_sec: 3600
    extra: { top_id: 26 }
  - id: netease_hot
    platform: netease
    name: 网易云热歌榜
    type: hot
    enabled: true
    overview_slot: right
    interval_sec: 3600
    extra: { playlist_id: "3778678" }
  - id: kugou_hot
    platform: kugou
    name: 酷狗音乐TOP500
    type: hot
    enabled: true
    interval_sec: 3600
    extra: { rank_id: 8888 }
  - id: kuwo_hot
    platform: kuwo
    name: 酷我热歌榜
    type: hot
    enabled: true
    interval_sec: 3600
    extra: { bang_id: 16 }
  - id: bilibili_hot
    platform: bilibili
    name: 哔哩哔哩音乐热歌榜
    type: hot
    enabled: true
    interval_sec: 3600
    extra: { list_type: 1 }
  - id: qq_douyin
    platform: qqmusic
    name: QQ音乐抖音热歌榜
    type: douyin
    enabled: true
    interval_sec: 3600
    extra: { top_id: 60 }
